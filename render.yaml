services:
  - type: web
    name: cosysync
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: COSYSYNC_SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
